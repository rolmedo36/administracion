<!-- Modal 1: Buscar Material -->
<div class="modal fade" id="modalBuscarMaterial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-search"></i> Buscar Material</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Escribe el nombre, código o descripción</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" class="form-control form-control-lg" id="inputBuscarMaterial" placeholder="Ej: Aceite, Bujía..." autocomplete="off">
                        <button class="btn btn-outline-secondary" type="button" id="btnLimpiarBusqueda"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div id="resultadosBusqueda" class="mt-3">
                    <div class="text-center text-muted py-4" id="mensajeInicial">
                        <i class="fas fa-box-open fa-3x mb-2"></i><br>Comienza a escribir para buscar
                    </div>
                    <div class="text-center py-4 d-none" id="mensajeCargando">
                        <div class="spinner-border text-primary"></div><p class="mt-2">Buscando...</p>
                    </div>
                    <div class="list-group d-none" id="listaResultados"></div>
                    <div class="text-center text-muted py-4 d-none" id="mensajeSinResultados">
                        <i class="fas fa-exclamation-circle fa-2x mb-2"></i><br>No se encontraron materiales
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal 2: Seleccionar Almacén y Cantidad -->
<div class="modal fade" id="modalSeleccionarAlmacen" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-warehouse"></i> Seleccionar Almacén</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <h6 id="materialSeleccionadoNombre" class="fw-bold mb-3"></h6>

                <div class="mb-3">
                    <label class="form-label fw-bold">Almacén de origen *</label>
                    <select id="selectAlmacen" class="form-select"></select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Cantidad a utilizar *</label>
                    <input type="number" id="inputCantidad" class="form-control" min="1" value="1">
                    <small class="text-muted" id="stockDisponibleTexto"></small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnConfirmarAgregar"><i class="fas fa-check"></i> Agregar a la Orden</button>
            </div>
        </div>
    </div>
</div>

<script>
let ordenActualId = null;
let materialSeleccionado = null;

function abrirModalBuscarMaterial(ordenId) {
    ordenActualId = ordenId;
    const modal = new bootstrap.Modal(document.getElementById('modalBuscarMaterial'));
    modal.show();
    document.getElementById('inputBuscarMaterial').value = '';
    document.getElementById('listaResultados').classList.add('d-none');
    document.getElementById('mensajeInicial').classList.remove('d-none');
    setTimeout(() => document.getElementById('inputBuscarMaterial').focus(), 500);
}

let searchTimeout;
document.getElementById('inputBuscarMaterial').addEventListener('input', function(e) {
    clearTimeout(searchTimeout);
    const query = e.target.value.trim();
    if (query.length < 2) {
        document.getElementById('listaResultados').classList.add('d-none');
        document.getElementById('mensajeInicial').classList.remove('d-none');
        return;
    }
    searchTimeout = setTimeout(() => buscarMateriales(query), 300);
});

function buscarMateriales(query) {
    document.getElementById('mensajeInicial').classList.add('d-none');
    document.getElementById('mensajeSinResultados').classList.add('d-none');
    document.getElementById('listaResultados').classList.add('d-none');
    document.getElementById('mensajeCargando').classList.remove('d-none');

    fetch(`/taller/ajax/buscar-productos/?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('mensajeCargando').classList.add('d-none');
            if (data.materiales && data.materiales.length > 0) {
                mostrarResultados(data.materiales);
            } else {
                document.getElementById('mensajeSinResultados').classList.remove('d-none');
            }
        });
}

function mostrarResultados(materiales) {
    const lista = document.getElementById('listaResultados');
    lista.innerHTML = '';

    materiales.forEach(mat => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3';

        let stockBadge = mat.es_inventariable ?
            `<span class="badge ${mat.stock_total > 0 ? 'bg-success' : 'bg-danger'}">${mat.stock_total} unid.</span>` :
            `<span class="badge bg-info">Servicio</span>`;

        item.innerHTML = `
            <div class="text-start">
                <span class="badge bg-secondary me-2">${mat.codigo}</span>
                <strong>${mat.nombre}</strong>
                <br><small class="text-muted">${mat.unidad_medida}</small>
            </div>
            <div class="text-end">
                <span class="badge bg-primary rounded-pill mb-1">$${mat.precio_unitario.toFixed(2)}</span><br>
                ${stockBadge}
            </div>
        `;

        if (mat.es_inventariable && mat.stock_total <= 0) {
            item.disabled = true;
            item.classList.add('disabled', 'opacity-50');
        } else {
            item.onclick = () => abrirModalAlmacen(mat);
        }
        lista.appendChild(item);
    });
    lista.classList.remove('d-none');
}

function abrirModalAlmacen(mat) {
    materialSeleccionado = mat;
    document.getElementById('materialSeleccionadoNombre').innerText = `${mat.codigo} - ${mat.nombre}`;

    const selectAlmacen = document.getElementById('selectAlmacen');
    selectAlmacen.innerHTML = '';

    if (mat.es_inventariable) {
        if (mat.almacenes.length === 0) {
            alert('Este material no tiene stock en ningún almacén.');
            return;
        }
        mat.almacenes.forEach(alm => {
            const opt = document.createElement('option');
            opt.value = alm.id;
            opt.textContent = `${alm.nombre} (Stock: ${alm.cantidad})`;
            opt.dataset.cantidad = alm.cantidad;
            selectAlmacen.appendChild(opt);
        });
        document.getElementById('stockDisponibleTexto').innerText = `Stock disponible en este almacén: ${mat.almacenes[0].cantidad}`;
        document.getElementById('inputCantidad').max = mat.almacenes[0].cantidad;
    } else {
        // Si es servicio/no inventariable, no pedimos almacén
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No aplica (Servicio)';
        selectAlmacen.appendChild(opt);
        document.getElementById('stockDisponibleTexto').innerText = 'Material no inventariable';
        document.getElementById('inputCantidad').max = 9999;
    }

    document.getElementById('inputCantidad').value = 1;

    // Cerrar modal de búsqueda y abrir el de almacén
    bootstrap.Modal.getInstance(document.getElementById('modalBuscarMaterial')).hide();
    new bootstrap.Modal(document.getElementById('modalSeleccionarAlmacen')).show();
}

// Actualizar max de cantidad al cambiar almacén
document.getElementById('selectAlmacen').addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    if (selectedOption.dataset.cantidad) {
        document.getElementById('inputCantidad').max = selectedOption.dataset.cantidad;
        document.getElementById('stockDisponibleTexto').innerText = `Stock disponible en este almacén: ${selectedOption.dataset.cantidad}`;
    }
});

document.getElementById('btnConfirmarAgregar').addEventListener('click', function() {
    const almacenId = document.getElementById('selectAlmacen').value;
    const cantidad = document.getElementById('inputCantidad').value;

    if (!cantidad || cantidad <= 0) {
        alert('La cantidad debe ser mayor a 0');
        return;
    }

    if (materialSeleccionado.es_inventariable && cantidad > document.getElementById('inputCantidad').max) {
        alert(`Stock insuficiente en este almacén. Máximo: ${document.getElementById('inputCantidad').max}`);
        return;
    }

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `/taller/ordenes/${ordenActualId}/agregar-item/`;

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const tipoItem = materialSeleccionado.es_inventariable ? 'REFACCION' : 'MATERIAL';

    form.innerHTML = `
        <input type="hidden" name="csrfmiddlewaretoken" value="${csrfToken}">
        <input type="hidden" name="tipo" value="${tipoItem}">
        <input type="hidden" name="material" value="${materialSeleccionado.id}">
        <input type="hidden" name="almacen" value="${almacenId}">
        <input type="hidden" name="descripcion" value="${materialSeleccionado.codigo} - ${materialSeleccionado.nombre}">
        <input type="hidden" name="cantidad" value="${cantidad}">
        <input type="hidden" name="precio_unitario" value="${materialSeleccionado.precio_unitario}">
    `;

    document.body.appendChild(form);
    form.submit();
});

document.getElementById('btnLimpiarBusqueda').addEventListener('click', function() {
    document.getElementById('inputBuscarMaterial').value = '';
    document.getElementById('listaResultados').classList.add('d-none');
    document.getElementById('mensajeInicial').classList.remove('d-none');
});
</script>
