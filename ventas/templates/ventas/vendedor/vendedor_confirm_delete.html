<!-- ventas/templates/ventas/vendedor/vendedor_confirm_delete.html -->
{% extends 'ventas/base_ventas.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center">
            <div class="card-header bg-danger text-white">
                <h5>Eliminar Vendedor</h5>
            </div>
            <div class="card-body">
                <p>¿Está seguro de que desea eliminar al vendedor <strong>{{ object.nombre_completo }}</strong>?</p>
                <p class="text-danger"><strong>Esta acción eliminará también su cuenta de usuario del sistema.</strong></p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Eliminar Vendedor</button>
                    <a href="{% url 'ventas:vendedor_detail' object.pk %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
