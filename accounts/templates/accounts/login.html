{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | NCP SOFTWARE</title>
    <!-- Tailwind CSS (CDN para asegurar estilos en esta página independiente) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter para un look moderno y profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-white to-blue-50/40 py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8">

        <!-- Encabezado con Logo -->
        <div class="text-center">
            <img class="mx-auto h-12 w-auto object-contain drop-shadow-sm"
                 src="{% static 'core/img/logo.png' %}"
                 alt="NCP SOFTWARE Logo">
            <h2 class="mt-6 text-3xl font-bold tracking-tight text-gray-900">
                Bienvenido a NCP SOFTWARE
            </h2>
            <p class="mt-2 text-sm text-gray-500">
                Inicia sesión para acceder al sistema
            </p>
        </div>

        <!-- Formulario de Login -->
        <form class="mt-8 space-y-6 bg-white p-8 rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100"
              method="POST">
            {% csrf_token %}

            <div class="space-y-5">
                <!-- Usuario -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required
                           class="appearance-none block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 sm:text-sm transition-all"
                           placeholder="Ingresa tu usuario">
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           class="appearance-none block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 sm:text-sm transition-all"
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Botón de Envío -->
            <div>
                <button type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-lg shadow-blue-500/30">
                    Iniciar Sesión
                </button>
            </div>

            <!-- Enlace a registro (basado en tu código original) -->
            <div class="text-center mt-4">
                <a href="{% url 'accounts:register' %}" class="text-sm font-medium text-blue-600 hover:text-blue-500 transition-colors">
                    ¿No tienes cuenta? Crear una nueva
                </a>
            </div>
        </form>

        <!-- Footer sutil -->
        <div class="text-center mt-6">
            <p class="text-xs text-gray-400">
                &copy; 2026 NCP SOFTWARE. Todos los derechos reservados.
            </p>
        </div>

    </div>

</body>
</html>
