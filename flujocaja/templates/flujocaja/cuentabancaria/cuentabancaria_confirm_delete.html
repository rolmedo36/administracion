{% extends 'flujocaja/base_flujocaja.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center">
            <div class="card-header bg-danger text-white">
                <h5>Confirmar Eliminación</h5>
            </div>
            <div class="card-body">
                <p>¿Eliminar la cuenta <strong>{{ object.numero_cuenta }}</strong> del banco <strong>{{ object.banco.nombre }}</strong>?<br>Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                    <a href="{% url 'flujocaja:cuentabancaria_list' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
